name=ModBee OTA
version=0.1.0
author=Matthew Reed
maintainer=Matthew Reed
sentence=Firmware updates for ModBee nodes over MQTT and Sparkplug B - pulled by the node, verified, and rolled back if the new image does not come up.
paragraph=The node asks for its image a range at a time, so a lost message costs one request, a dropped link resumes where it stopped, and a gateway can relay an image to nodes behind it without storing it. Every image is checked against its SHA-256 and, optionally, an Ed25519 or ECDSA P-256 signature before it is switched to, and a new image that does not confirm itself is rolled back. Nothing waits: update() does a bounded slice of work, so it runs inside a PLC scan. ESP32 uses its own A/B slots; other chips plug in a small storage and bootloader driver.
